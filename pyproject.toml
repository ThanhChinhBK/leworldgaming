[project]
name = "leworldgaming"
version = "0.0.1"
description = "Evaluating LeWorldModel (JEPA) vs State-Vector MBRL on DareFightingICE"
readme = "README.md"
authors = [
    { name = "Chinh Nguyen", email = "nguyenthanhchinh96@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    # Game interface
    "pyftg>=2.1",
    # Numerics & I/O
    "numpy>=1.26,<2",
    "h5py>=3.10",
    "lmdb>=1.4",
    "pyyaml>=6",
    "omegaconf>=2.3",
    "tqdm>=4.66",
    # ML — torch>=2.7 ships cu128 wheels with sm_120 (Blackwell, e.g. RTX 50xx) kernels.
    "torch>=2.7",
    "torchvision>=0.22",
    "einops>=0.8",
    # Vendored dreamerv3-torch deps
    "ruamel.yaml>=0.18",
    "gymnasium>=0.29",
    # Image processing (fast pixel decode for data collection)
    "opencv-python-headless>=4.8",
    # Logging
    "tensorboard>=2.16",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "ipython>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leworldgaming"]

# Per-platform torch wheel sourcing.
# Mac → CPU wheel (works with MPS); Linux → cu128 (Blackwell sm_120 support).
# `uv sync` resolves automatically based on host sys_platform.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
