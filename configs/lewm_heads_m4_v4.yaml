# Stage-B head trainer config, v4: same as lewm_heads_m4.yaml (M4
# imagined-rollout supervision + M3 value bootstrap + escalated
# continuation-head regularization from v2/v3), plus reward/value head
# ENSEMBLING (2026-07-20 follow-up).
#
# Rationale: the offline calibration audit (scripts/audit_lewm_calibration.py,
# see docs/lewm_calibration_audit_and_ensembling_2026-07-20.md) refuted the
# "reward head exploited via imagined-latent drift" hypothesis (r_gap ~0.0000
# at every depth 1-5) but found the reward head is imprecise on rare/decisive
# (|reward|>0) frames regardless of latent source (~0.05 MAE vs +-0.3 range) --
# a data-scarcity/head-precision issue. Ensembling N independently-initialized
# reward/value heads lets the CEM planner score with mean-minus-uncertainty
# (planner.cem_shooting's uncertainty_penalty) instead of trusting a single
# head's point estimate on frames it has little training signal for.
#
# Same replay data, same Stage-A encoder/predictor (frozen), same
# architecture as v3 -- only reward_ensemble_size/value_ensemble_size change.

heads:
  reward_bins: 41
  reward_low: -1.0
  reward_high: 1.0
  value_bins: 41
  value_low: -10.0
  value_high: 10.0
  hidden_dim: 512
  imagined_horizon: 5
  lambda_return: 0.95
  gamma: 0.997
  target_ema: 0.99
  reward_loss_weight: 1.0
  cont_loss_weight: 1.0
  value_loss_weight: 1.0
  imagined_loss_weight: 1.0
  probe_loss_weight: 0.0
  terminal_window_fraction: 0.1
  cont_dropout: 0.35
  cont_hidden_dim: 64
  reward_ensemble_size: 3
  value_ensemble_size: 3

# Optimization (separate from Stage-A optimizer)
batch_size: 16
lr: 3.0e-4
weight_decay: 1.0e-3
cont_weight_decay: 0.05
grad_clip: 1.0

# I/O
data_path: /media/jeovach/New Volume/leworldgaming
ckpt_in: data/lewm_checkpoint_stride2.pt
ckpt_out: data/lewm_heads_checkpoint_stride2_m4_v4.pt
log_every: 100
val_split: 0.1
val_every: 1000
val_batches: 8
ckpt_every: 1000
seed: 0
