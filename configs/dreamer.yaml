# DreamerV3 offline training config — vector / proprio mode.
# Inherits from external/dreamerv3-torch/configs.yaml (defaults + dmc_proprio);
# anything listed here overrides DEFAULTS in train_dreamer.py.

# Data + I/O
data_path: data/replay.h5
episode_dir: data/dreamer_episodes
ckpt_path: data/dreamer_checkpoint.pt
logdir: data/dreamer_logs
state_dim: 42         # = DREAMER_STATE_DIM (own/opp continuous + state/atk one-hots + globals)

# Optimization
batch_size: 16
batch_length: 64
model_lr: 1.0e-4
actor_lr: 3.0e-5
critic_lr: 3.0e-5
imag_horizon: 15
log_every: 10
ckpt_every: 1000      # save a checkpoint every N steps (0 = only at end)
seed: 0

# Behaviour modifiers
compile: false        # torch.compile is flaky on MPS; flip on for CUDA boxes
precision: 32         # 16 enables AMP — set to 16 on CUDA only
device: null          # null → auto (CUDA → MPS → CPU)
actor_dist: onehot    # discrete-action policy head
