# Stage-B head trainer config, milestone M5: adds a policy-prior head
# (behavior-cloned from the recorded dataset) on top of the M4 checkpoint.
# See src/leworldgaming/agents/lewm/policy_head.py for the design rationale
# (CEM warm-start prior, not a stand-alone policy).
#
# Resumes from the existing m4_v3 checkpoint (reward/value/continuation
# heads keep their already-converged weights; only the new policy_head is
# freshly initialized and trained via the extra steps beyond num_steps=20000).

heads:
  reward_bins: 41
  reward_low: -1.0
  reward_high: 1.0
  value_bins: 41
  value_low: -10.0
  value_high: 10.0
  hidden_dim: 512
  imagined_horizon: 5
  lambda_return: 0.95
  gamma: 0.997
  target_ema: 0.99
  reward_loss_weight: 1.0
  cont_loss_weight: 1.0
  value_loss_weight: 1.0
  imagined_loss_weight: 1.0
  probe_loss_weight: 0.0
  terminal_window_fraction: 0.1
  cont_dropout: 0.35
  cont_hidden_dim: 64
  policy_loss_weight: 1.0
  policy_hidden_dim: 256

# Optimization (separate from Stage-A optimizer)
batch_size: 16
lr: 3.0e-4
weight_decay: 1.0e-3
cont_weight_decay: 0.05
grad_clip: 1.0

# I/O
data_path: /media/jeovach/New Volume/leworldgaming
ckpt_in: data/lewm_checkpoint_stride5.pt
ckpt_out: data/lewm_heads_checkpoint_stride5_m5_policy.pt
resume: true
log_every: 50
val_split: 0.1
val_every: 1000
val_batches: 8
ckpt_every: 2000
seed: 0
