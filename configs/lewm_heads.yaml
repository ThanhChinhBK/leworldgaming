# Stage-B head trainer config. Architecture is loaded from the input
# checkpoint's stored config; this file only contains head-specific
# hyperparameters and I/O paths.

heads:
  reward_bins: 41
  reward_low: -1.0
  reward_high: 1.0
  value_bins: 41
  value_low: -10.0
  value_high: 10.0
  hidden_dim: 512
  imagined_horizon: 0      # M2: reward+cont only.
  lambda_return: 0.95
  gamma: 0.997
  target_ema: 0.99
  reward_loss_weight: 1.0
  cont_loss_weight: 1.0
  value_loss_weight: 0.0  # M3: not yet.
  imagined_loss_weight: 0.0  # M4: not yet.
  probe_loss_weight: 0.0  # M5: not yet.
  terminal_window_fraction: 0.1  # Ensure continuation sees terminal states.

# Optimization (separate from Stage-A optimizer)
batch_size: 16
lr: 3.0e-4
weight_decay: 1.0e-3
grad_clip: 1.0

# I/O
data_path: /media/jeovach/New Volume/leworldgaming
ckpt_in: data/lewm_checkpoint_stride5.pt
ckpt_out: data/lewm_heads_checkpoint_stride5.pt
log_every: 10
val_split: 0.1
val_every: 1000
val_batches: 8
ckpt_every: 1000      # save a checkpoint every N steps (0 = only at end)
seed: 0
