# DreamerV3 offline training config — full image (vision) mode.
# Inherits from external/dreamerv3-torch/configs.yaml (defaults + dmc_vision);
# anything listed here overrides DEFAULTS in train_dreamer.py.
#
# Uses the replay buffer's pixels (3,224,224) down-sampled to image_size²,
# fed to the upstream ConvEncoder/ConvDecoder. Sized to fit a 16 GB GPU:
# default DreamerV3 world model (~18M params) + batch 16×64 vision at 64²
# trains comfortably in well under 8 GB. Drop batch_size to 8 if you also
# run other GPU work alongside it.

# Data + I/O
data_path: data/replay.h5
episode_dir: data/dreamer_image_episodes   # separate cache from vector mode
ckpt_path: data/dreamer_image_checkpoint.pt
logdir: data/dreamer_image_logs

# Observation
obs_mode: image
image_size: 64        # power-of-two side; ConvEncoder stages = log2(size)-log2(4)

# Optimization
batch_size: 16
batch_length: 64
model_lr: 1.0e-4
actor_lr: 3.0e-5
critic_lr: 3.0e-5
imag_horizon: 15
log_every: 10
seed: 0

# Behaviour modifiers
compile: false        # flip on for a CUDA box to speed up training
precision: 16         # AMP — halves VRAM on CUDA; set to 32 on CPU/MPS
device: null          # null → auto (CUDA → MPS → CPU)
actor_dist: onehot    # discrete-action policy head
